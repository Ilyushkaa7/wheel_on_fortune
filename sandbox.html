<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Песочные часы</title>

    <link rel="stylesheet" href="css/sandbox.css">
</head>
<body>

<div class="sandbox-container">

    <h1>Песочные часы</h1>

    <div class="hourglass-wrapper">

        <div class="hourglass idle" id="hourglass">

            <div class="top"></div>

            <div class="stream"></div>

            <div class="bottom"></div>

        </div>

    </div>

    <div class="timer-display" id="timerDisplay">
        01:00
    </div>

    <div class="controls">

        <div class="time-buttons">

            <button data-time="30">
                30 сек
            </button>

            <button data-time="60" class="active">
                1 мин
            </button>

            <button data-time="120">
                2 мин
            </button>

            <button data-time="300">
                5 мин
            </button>

        </div>

        <div class="action-buttons">

            <button id="startBtn" class="btn-start">
                Начать
            </button>

            <button id="resetBtn" class="btn-reset">
                Сброс
            </button>

        </div>

        <div class="setting">

            <label class="switch-label">

                <span>
                    Автопереворот
                </span>

                <div class="toggle-switch">

                    <input
                        type="checkbox"
                        id="autoFlipToggle"
                        checked
                    >

                    <span class="slider"></span>

                </div>

            </label>

        </div>

    </div>

</div>

<script src="js/sandbox.js"></script>

</body>
</html>
